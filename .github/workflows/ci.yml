# 워크플로 이름 (GitHub Actions 탭에 보이는 이름)
name: CI

# 언제 실행할지: main에 push될 때, PR이 올라올 때
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    # GitHub가 빌려주는 리눅스 컴퓨터
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 코드 받기
      - uses: actions/checkout@v4

      # 2. 파이썬 설치 (잠금 파일을 3.13으로 만들었으니 맞춤)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 3. 잠금 파일대로 설치 + 내 패키지 연결 (1단계에서 확인한 두 줄)
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      # 4. 린트
      - name: Ruff check
        run: ruff check src/ tests/

      # 5. 포맷 검사 (고치지 않고 검사만)
      - name: Ruff format check
        run: ruff format --check src/ tests/

      # 6. 테스트
      - name: Pytest
        run: pytest -v

  # Docker 이미지가 빌드되고 안에 도구가 들어 있는지 확인
  docker-build:
    runs-on: ubuntu-latest
    steps:
      # 1. 레포 코드 받기
      - uses: actions/checkout@v4

      # 2. Docker 빌드 도구 준비
      - uses: docker/setup-buildx-action@v3

      # 3. 이미지 빌드 (push 없이, Actions 캐시 사용)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sbom-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. 실행 확인: 사용법 출력 + Syft·Trivy 설치 여부
      - name: Smoke test
        run: |
          docker run --rm sbom-agent:ci --help
          docker run --rm --entrypoint syft sbom-agent:ci version
          docker run --rm --entrypoint trivy sbom-agent:ci --version
