# 워크플로 이름 (GitHub Actions 탭에 보이는 이름)
name: CI

# 언제 실행할지: main에 push될 때, PR이 올라올 때
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    # GitHub가 빌려주는 리눅스 컴퓨터
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 코드 받기
      - uses: actions/checkout@v4

      # 2. 파이썬 설치 (잠금 파일을 3.13으로 만들었으니 맞춤)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 3. 잠금 파일대로 설치 + 내 패키지 연결 (1단계에서 확인한 두 줄)
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      # 4. 린트
      - name: Ruff check
        run: ruff check src/ tests/

      # 5. 포맷 검사 (고치지 않고 검사만)
      - name: Ruff format check
        run: ruff format --check src/ tests/

      # 6. 테스트
      - name: Pytest
        run: pytest -v
